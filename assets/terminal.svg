<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="100%" height="100%">
  <defs>
    <!-- Background Base Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Deep Red Center Glow -->
    <radialGradient id="redAura" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.32">
        <animate attributeName="stop-opacity" values="0.18;0.38;0.18" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="60%" stop-color="#88001b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Intense Crimson Glow Filter -->
    <filter id="crimsonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Typing Clips (Reveals text character-by-character) -->
    <clipPath id="type1">
      <rect x="0" y="0" width="0" height="25">
        <animate attributeName="width" values="0;0;190;190" keyTimes="0;0.05;0.16;1" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="type2">
      <rect x="0" y="0" width="0" height="25">
        <animate attributeName="width" values="0;0;150;150" keyTimes="0;0.22;0.34;1" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="type3">
      <rect x="0" y="0" width="0" height="25">
        <animate attributeName="width" values="0;0;190;190" keyTimes="0;0.44;0.56;1" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="type4">
      <rect x="0" y="0" width="0" height="25">
        <animate attributeName="width" values="0;0;270;270" keyTimes="0;0.68;0.80;1" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .window-title { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #8b949e; font-weight: bold; }
    .term-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; }
    .prompt-root { fill: #ff2a4b; font-weight: bold; }
    .prompt-sym { fill: #58a6ff; font-weight: bold; }
    .cmd { fill: #39d353; font-weight: bold; }
    .out-dim { fill: #8b949e; }
    .out-cyan { fill: #56d364; }
    .out-warn { fill: #e3b341; }
    .out-target { fill: #58a6ff; }

    /* Constant Breathing & Glowing Logo */
    @keyframes pulseGlow {
      0% {
        transform: scale(0.96);
        opacity: 0.28;
      }
      50% {
        transform: scale(1.04);
        opacity: 0.65;
      }
      100% {
        transform: scale(0.96);
        opacity: 0.28;
      }
    }
    .pulsing-logo {
      transform-origin: 410px 255px;
      animation: pulseGlow 4.5s ease-in-out infinite;
    }

    /* Output line appearances */
    @keyframes fadeLine {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    .resp1 { animation: show1 14s infinite; }
    .resp2 { animation: show2 14s infinite; }
    .resp3 { animation: show3 14s infinite; }
    .resp4 { animation: show4 14s infinite; }

    @keyframes show1 { 0%, 17% { opacity: 0; } 18%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes show2 { 0%, 35% { opacity: 0; } 36%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes show3 { 0%, 57% { opacity: 0; } 58%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes show4 { 0%, 81% { opacity: 0; } 82%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }

    /* Blinking Cursor */
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { fill: #39d353; animation: blink 0.8s infinite; }
  </style>

  <!-- Terminal Window Shell -->
  <rect width="820" height="470" rx="14" fill="url(#termBg)" stroke="#222734" stroke-width="1.5" />

  <!-- Background Glowing Aura -->
  <rect width="820" height="470" rx="14" fill="url(#redAura)" />

  <!-- CONSTANTLY GROWING & SHINING RED LOGO -->
  <g class="pulsing-logo" filter="url(#crimsonGlow)">
    <!-- Kali / Dragon Cyber Crest Silhouette -->
    <path d="M 410,165 
             C 435,190 465,195 490,210 
             C 455,220 440,240 445,265 
             C 460,250 485,245 505,255 
             C 480,275 465,305 470,335 
             C 450,315 440,290 425,285 
             C 420,310 405,335 385,345 
             C 395,320 395,295 385,275 
             C 370,295 345,305 320,305 
             C 345,285 360,260 355,235 
             C 375,245 390,230 380,210 
             C 395,205 405,185 410,165 Z" 
          fill="#ff003b" />
    <!-- Cyber Ring accents -->
    <circle cx="410" cy="255" r="95" fill="none" stroke="#ff003b" stroke-width="2" stroke-dasharray="8 6" opacity="0.5" />
    <circle cx="410" cy="255" r="115" fill="none" stroke="#b30027" stroke-width="1.2" stroke-dasharray="16 10" opacity="0.3" />
  </g>

  <!-- Terminal Title Bar -->
  <rect width="820" height="36" rx="14" fill="#121620" />
  <rect y="24" width="820" height="12" fill="#121620" />
  <line x1="0" y1="36" x2="820" y2="36" stroke="#222734" stroke-width="1" />

  <!-- Control Dots -->
  <circle cx="22" cy="18" r="5.5" fill="#ff5f56" />
  <circle cx="40" cy="18" r="5.5" fill="#ffbd2e" />
  <circle cx="58" cy="18" r="5.5" fill="#27c93f" />
  <text class="window-title" x="410" y="23" text-anchor="middle">root@kali: ~ (zsh)</text>

  <!-- Terminal Content with Typing FX -->
  <g transform="translate(32, 68)" class="term-text">
    
    <!-- Line 1: whoami -->
    <g transform="translate(0, 0)">
      <text x="0" y="0"><tspan class="prompt-root">root@kali</tspan><tspan class="prompt-sym">:[~]# </tspan></text>
      <g clip-path="url(#type1)">
        <text x="110" y="0" class="cmd">whoami &amp;&amp; hostname</text>
      </g>
      <text x="0" y="22" class="out-dim resp1">anzarhasnat // offensive-security-lab [UID: 0]</text>
    </g>

    <!-- Line 2: iwconfig -->
    <g transform="translate(0, 52)">
      <text x="0" y="0"><tspan class="prompt-root">root@kali</tspan><tspan class="prompt-sym">:[~]# </tspan></text>
      <g clip-path="url(#type2)">
        <text x="110" y="0" class="cmd">iwconfig wlan0</text>
      </g>
      <g class="resp2">
        <text x="0" y="22" class="out-dim">wlan0   IEEE 802.11  Mode:Managed  Frequency:2.437 GHz  Tx-Power=20 dBm</text>
      </g>
    </g>

    <!-- Line 3: airmon-ng -->
    <g transform="translate(0, 104)">
      <text x="0" y="0"><tspan class="prompt-root">root@kali</tspan><tspan class="prompt-sym">:[~]# </tspan></text>
      <g clip-path="url(#type3)">
        <text x="110" y="0" class="cmd">airmon-ng start wlan0</text>
      </g>
      <g class="resp3">
        <text x="0" y="22" class="out-warn">[i] Killing conflicting processes...</text>
        <text x="0" y="42" class="out-cyan">[✓] Monitor mode enabled on virtual interface [wlan0mon]</text>
      </g>
    </g>

    <!-- Line 4: airodump-ng -->
    <g transform="translate(0, 176)">
      <text x="0" y="0"><tspan class="prompt-root">root@kali</tspan><tspan class="prompt-sym">:[~]# </tspan></text>
      <g clip-path="url(#type4)">
        <text x="110" y="0" class="cmd">airodump-ng -c 6 --bssid 00:1A:2B:6F:98:C1</text>
      </g>
      
      <!-- Packet Stream Table -->
      <g class="resp4" transform="translate(0, 24)">
        <text x="0" y="0" class="out-dim">CH 6 ][ Elapsed: 4s ][ WPA Handshake: 00:1A:2B:6F:98:C1 [CAPTURED]</text>
        <text x="0" y="22" class="out-target">BSSID              PWR  RXQ  BEACONS  #/s  CH  ENC  CIPHER  AUTH  ESSID</text>
        <line x1="0" y1="28" x2="750" y2="28" stroke="#30363d" stroke-width="1" />
        <text x="0" y="48" class="out-cyan">00:1A:2B:6F:98:C1  -28  100      240   34   6  WPA2 CCMP    PSK   TARGET_AP</text>
        <text x="0" y="68" class="out-dim">A4:2B:B0:11:F2:04  -68   42       84    4   6  WPA2 CCMP    PSK   GuestNet</text>
        
        <!-- Live Command Prompt & Blinking Cursor -->
        <text x="0" y="102"><tspan class="prompt-root">root@kali</tspan><tspan class="prompt-sym">:[~]# </tspan><tspan class="cmd">payload_inject --stealth</tspan></text>
        <rect class="cursor" x="315" y="90" width="8" height="15" />
      </g>
    </g>

  </g>
</svg>
