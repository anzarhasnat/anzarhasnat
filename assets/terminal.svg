<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="100%" height="100%">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
  </defs>

  <style>
    .window-title { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #8b949e; font-weight: bold; }
    .term-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13.5px; fill: #c9d1d9; }
    .prompt-root { fill: #ff3333; font-weight: bold; }
    .prompt-sym { fill: #58a6ff; font-weight: bold; }
    .cmd { fill: #39d353; font-weight: bold; }
    .out-dim { fill: #7d8590; }
    .out-cyan { fill: #56d364; }
    .out-warn { fill: #e3b341; }
    .out-target { fill: #58a6ff; }

    /* Timeline Animations */
    @keyframes line1 { 0% { opacity: 0; } 5% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes line2 { 0%, 14% { opacity: 0; } 18% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes line3 { 0%, 24% { opacity: 0; } 28% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes line4 { 0%, 35% { opacity: 0; } 39% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes line5 { 0%, 48% { opacity: 0; } 52% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes line6 { 0%, 62% { opacity: 0; } 66% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes line7 { 0%, 75% { opacity: 0; } 78% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes line8 { 0%, 86% { opacity: 0; } 89% { opacity: 1; } 100% { opacity: 1; } }

    .l1 { animation: line1 12s infinite; }
    .l2 { animation: line2 12s infinite; }
    .l3 { animation: line3 12s infinite; }
    .l4 { animation: line4 12s infinite; }
    .l5 { animation: line5 12s infinite; }
    .l6 { animation: line6 12s infinite; }
    .l7 { animation: line7 12s infinite; }
    .l8 { animation: line8 12s infinite; }

    /* Blinking Cursor */
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { fill: #39d353; animation: blink 1s infinite; }
  </style>

  <!-- Terminal Window Background -->
  <rect width="820" height="460" rx="12" fill="url(#termGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Terminal Title Bar -->
  <rect width="820" height="38" rx="12" fill="#161b22" />
  <rect y="26" width="820" height="12" fill="#161b22" />
  <line x1="0" y1="38" x2="820" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- macOS / Linux Window Action Dots -->
  <circle cx="24" cy="19" r="6" fill="#ff5f56" />
  <circle cx="44" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="19" r="6" fill="#27c93f" />

  <text class="window-title" x="410" y="24" text-anchor="middle">root@kali: ~ (bash)</text>

  <!-- Terminal Body Content -->
  <g transform="translate(30, 75)" class="term-text">
    <!-- Command 1: whoami -->
    <g class="l1">
      <text x="0" y="0"><tspan class="prompt-root">root@kali</tspan><tspan class="prompt-sym">:[~]#</tspan> <tspan class="cmd">whoami &amp;&amp; hostname</tspan></text>
      <text x="0" y="22" class="out-dim">anzarhasnat // security-research-node [UID: 0]</text>
    </g>

    <!-- Command 2: iwconfig -->
    <g class="l2">
      <text x="0" y="60"><tspan class="prompt-root">root@kali</tspan><tspan class="prompt-sym">:[~]#</tspan> <tspan class="cmd">iwconfig wlan0</tspan></text>
      <text x="0" y="82" class="out-dim">wlan0     IEEE 802.11  Mode:Managed  Frequency:2.437 GHz  Access Point: Not-Associated</text>
      <text x="0" y="102" class="out-dim">          Tx-Power=20 dBm   Retry short limit:7   RTS thr:off   Fragment thr:off</text>
    </g>

    <!-- Command 3: airmon-ng -->
    <g class="l3">
      <text x="0" y="140"><tspan class="prompt-root">root@kali</tspan><tspan class="prompt-sym">:[~]#</tspan> <tspan class="cmd">airmon-ng start wlan0</tspan></text>
      <text x="0" y="162" class="out-warn">[i] Killing 2 conflicting processes (wpa_supplicant, NetworkManager)...</text>
      <text x="0" y="182" class="out-cyan">[✓] Driver enabled: monitor mode vif enabled on [wlan0mon]</text>
    </g>

    <!-- Command 4: airodump-ng capture session -->
    <g class="l4">
      <text x="0" y="220"><tspan class="prompt-root">root@kali</tspan><tspan class="prompt-sym">:[~]#</tspan> <tspan class="cmd">airodump-ng wlan0mon --channel 6</tspan></text>
      <text x="0" y="242" class="out-dim">CH  6 ][ Elapsed: 8s ][ 2026-09-04 15:00 ][ WPA handshake: 00:1A:2B:6F:98:C1</text>
    </g>

    <!-- Sniffer Frame Dump Header -->
    <g class="l5">
      <text x="0" y="272" class="out-target">BSSID              PWR  Beacons    #Data, #/s  CH   MB   ENC CIPHER AUTH ESSID</text>
      <line x1="0" y1="280" x2="760" y2="280" stroke="#30363d" stroke-width="1" />
    </g>

    <!-- Sniffer Target Output Rows -->
    <g class="l6">
      <text x="0" y="302" class="out-dim">A4:2B:B0:11:F2:04  -42       48       132   12   6  130   WPA2 CCMP   PSK  CyberNet_5G</text>
      <text x="0" y="322" class="out-dim">70:3A:D8:E5:9C:12  -65       21        44    2   6   54   WPA2 CCMP   PSK  Corporate_Guest</text>
    </g>

    <!-- Real-time Injection / Handshake Capture -->
    <g class="l7">
      <text x="0" y="342" class="out-cyan">00:1A:2B:6F:98:C1  -31      109       412   48   6   54   WPA2 CCMP   PSK  TARGET_AP [INJECTING]</text>
    </g>

    <!-- Live Active Prompt with Blinking Block Cursor -->
    <g class="l8">
      <text x="0" y="375"><tspan class="prompt-root">root@kali</tspan><tspan class="prompt-sym">:[~]#</tspan> <tspan class="cmd">payload_inject --stealth</tspan></text>
      <rect class="cursor" x="290" y="362" width="9" height="15" />
    </g>
  </g>
</svg>
