<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <radialGradient id="cyberGlow1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.35">
        <animate attributeName="stop-color" values="#ff0055;#7928ca;#00dfd8;#ff0055" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyberGlow2" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#0070f3" stop-opacity="0.35">
        <animate attributeName="stop-color" values="#0070f3;#ff007a;#00dfd8;#0070f3" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #00dfd8; letter-spacing: 1.5px; }
    .quote { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-style: italic; fill: #8892b0; }
    .item-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #ccd6f6; }
    .item-value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 400; fill: #a8b2d1; }
    .footer-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #ff0055; letter-spacing: 2px; }

    /* Scanline pulse animation */
    @keyframes scan {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(480px); opacity: 0; }
    }
    .scanner {
      animation: scan 6s linear infinite;
    }

    /* Subtle pulse for badge ring */
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.02); }
    }
    .pulse-ring {
      transform-origin: center;
      animation: pulse 4s ease-in-out infinite;
    }
  </style>

  <rect width="850" height="480" rx="18" fill="#0b0d13" stroke="#1f2430" stroke-width="1.5" />
  
  <rect width="850" height="480" rx="18" fill="url(#cyberGlow1)" />
  <rect width="850" height="480" rx="18" fill="url(#cyberGlow2)" />
  <rect width="850" height="480" rx="18" fill="url(#grid)" />

  <line class="scanner" x1="0" y1="0" x2="850" y2="0" stroke="url(#cyberGlow2)" stroke-width="2" opacity="0.4" />

  <rect class="pulse-ring" x="2" y="2" width="846" height="476" rx="16" fill="none" stroke="#00dfd8" stroke-width="1" opacity="0.2" filter="url(#glow)" />

  <g transform="translate(45, 48)">
    <text class="title" x="0" y="0">Hi, I'm Anzar Hasnat 👋</text>
    <text class="subtitle" x="0" y="26">CYBERSECURITY ENTHUSIAST  •  AI &amp; WEB DEVELOPMENT</text>
    <text class="quote" x="0" y="52">"Exploring technology, building ideas, and learning something new every day."</text>
    
    <line x1="0" y1="68" x2="760" y2="68" stroke="#232b3e" stroke-width="1" />
  </g>

  <g transform="translate(45, 155)">
    <g transform="translate(0, 0)">
      <text class="item-label" x="0" y="0">🔐 Interested in:</text>
      <text class="item-value" x="125" y="0">Cybersecurity &amp; Artificial Intelligence</text>
    </g>

    <g transform="translate(0, 32)">
      <text class="item-label" x="0" y="0">🚀 Currently building:</text>
      <text class="item-value" x="165" y="0">YAT AI — AI-powered 5-stage student assessment platform</text>
    </g>

    <g transform="translate(0, 64)">
      <text class="item-label" x="0" y="0">🌱 Currently learning:</text>
      <text class="item-value" x="160" y="0">HTML &amp; CSS</text>
    </g>

    <g transform="translate(0, 96)">
      <text class="item-label" x="0" y="0">🤝 Open to:</text>
      <text class="item-value" x="90" y="0">AI, Cybersecurity &amp; Web Development projects</text>
    </g>

    <g transform="translate(0, 128)">
      <text class="item-label" x="0" y="0">💬 Ask me about:</text>
      <text class="item-value" x="135" y="0">AI, HTML &amp; CSS</text>
    </g>

    <g transform="translate(0, 160)">
      <text class="item-label" x="0" y="0">📫 Email:</text>
      <text class="item-value" x="70" y="0">anzarhasnat@gmail.com</text>
    </g>

    <g transform="translate(0, 192)">
      <text class="item-label" x="0" y="0">⚡ Fun fact:</text>
      <text class="item-value" x="90" y="0">My projects usually start with “What if...?”</text>
    </g>
  </g>

  <g transform="translate(45, 430)">
    <line x1="0" y1="0" x2="760" y2="0" stroke="#232b3e" stroke-width="1" />
    <text class="footer-text" x="380" y="24" text-anchor="middle">ALWAYS LEARNING. ALWAYS BUILDING.</text>
  </g>
</svg>
